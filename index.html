<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CLAN-8 的個人網頁</title>
    <style>
        body {
            background-color: #1a1a2e; 
            color: #ffffff;            
            font-family: 'Arial', sans-serif;
            text-align: center;        
            padding-top: 40px;
        }

        h1 {
            color: #00ffff;            
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            color: #8a8ab5;
            font-size: 1.1rem;
        }

        /* 🎵 音樂播放器樣式 */
        .music-container {
            background-color: #162447;
            border: 2px solid #00ffff;
            display: inline-block;
            padding: 15px;
            border-radius: 10px;
            margin: 20px auto;
        }

        /* 🖼️ 圖片樣式（圓形頭貼） */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* 讓圖片變圓形 */
            border: 3px solid #ff2a74;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 15px #ff2a74;
        }

        .my-button {
            display: inline-block;
            padding: 12px 25px;
            margin: 10px;
            background-color: #ff2a74; 
            color: white;
            text-decoration: none;     
            font-weight: bold;
            border-radius: 50px;       
            box-shadow: 0 4px 15px rgba(255, 42, 116, 0.4); 
            transition: 0.3s;          
        }

        .my-button:hover {
            background-color: #ff5e97;
            transform: scale(1.05);    
        }
    </style>
</head>
<body>

    <!-- 1. 🖼️ 個人頭像區 -->
    <!-- 提示：您可以把引號內的網址，換成任何網路上找得到的圖片網址 -->
    <img src="clan8.png" alt="個人頭像" class="profile-img">

    <h1>CLAN-8 的個人空間</h1>
    <p>歡迎來到我的 GitHub Pages 實驗室 🚀</p>
    
    <!-- 2. 🎵 音樂播放區 -->
    <div class="music-container">
        <p style="color: #00ffff; margin-top: 0; font-size: 0.9rem;">🎵 點擊播放背景音樂</p>
        <!-- 提示：這裡使用了一首免費的鋼琴音樂當範例 -->
        <audio controls loop>
            <source src="https://soundhelix.com" type="audio/mpeg">
            您的瀏覽器不支援音樂播放。
        </audio>
    </div>

    <br>

    <!-- 3. 🔗 社群連結區 -->
    <!-- 💡 修改指南：把 href=" 裡面的網址 " 換成您真實的 IG 或 FB 網址就可以囉！ -->
    <a href="https://instagram.com" target="_blank" class="my-button">📸 追蹤我的 Instagram</a>
    <a href="https://github.com" target="_blank" class="my-button">💻 參觀我的 GitHub</a>

</body>
</html>
